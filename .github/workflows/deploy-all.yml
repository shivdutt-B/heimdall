name: Deploy Heimdall

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent two deploys from stepping on each other.
concurrency:
  group: deploy-heimdall
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # The instance has no Elastic IP, so resolve its current public IP every run.
      - name: Resolve EC2 public IP
        id: ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=heimdall-al2023" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "No running heimdall-internal instance found in ap-south-1"
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      # One-time host tooling, idempotent on later runs. Runs in its own SSH
      # session so the docker group membership applies to the deploy step.
      - name: Install host prerequisites
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2.outputs.ip }}
          username: ${{ secrets.EXC_USER }}
          key: ${{ secrets.EXC_SSH_KEY }}
          script: |
            set -euo pipefail

            # t3.micro has 1GB RAM - add swap so npm/tsc/docker builds don't OOM
            if ! sudo swapon --show | grep -q .; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # AL2023 ships curl-minimal (provides curl); installing full curl conflicts
            # gnupg2 is required by Doppler's installer for signature verification
            sudo dnf install -y git ca-certificates docker gnupg2 nodejs20 nodejs20-npm

            command -v pm2 >/dev/null || sudo npm install -g pm2
            command -v doppler >/dev/null || curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh

            sudo systemctl enable --now docker
            sudo usermod -aG docker "$USER"
            sudo env PATH="$PATH:/usr/bin" pm2 startup systemd -u "$USER" --hp "$HOME" || true

      - name: Deploy services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2.outputs.ip }}
          username: ${{ secrets.EXC_USER }}
          key: ${{ secrets.EXC_SSH_KEY }}
          command_timeout: 40m
          envs: DOPPLER_TOKEN_ALERT,DOPPLER_TOKEN_DISPATCH,DOPPLER_TOKEN_WORKER,DOPPLER_TOKEN_SCALE_WORKER
          script: |
            set -euo pipefail

            REPO_DIR="$HOME/heimdall"
            REPO_URL="https://github.com/shivdutt-B/heimdall.git"

            # 1. Fetch the code
            if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # 2. Keep only the four services, remove everything else
            find "$REPO_DIR" -mindepth 1 -maxdepth 1 \
              ! -name .git \
              ! -name alert-service \
              ! -name dispatch-service \
              ! -name scale-worker-service \
              ! -name worker-service \
              -exec rm -rf {} +

            # Shared deploy helper: Doppler secrets -> install -> build -> PM2
            deploy_service() {
              local dir="$1" name="$2" token="$3"

              echo "--- Deploying $name ---"
              cd "$REPO_DIR/$dir"

              DOPPLER_TOKEN="$token" doppler secrets download --no-file --format env > .env

              npm ci --prefer-offline --no-audit --no-fund
              npm run build

              # PM2 auto-restarts a crashed process by default
              if pm2 describe "$name" >/dev/null 2>&1; then
                pm2 restart "$name" --update-env
              else
                pm2 start npm --name "$name" -- run start
              fi
            }

            # 3 + 4. Doppler secrets for alert-service, then start it
            deploy_service "alert-service" "alert-service" "$DOPPLER_TOKEN_ALERT"

            # 5. dispatch-service
            deploy_service "dispatch-service" "dispatch-service" "$DOPPLER_TOKEN_DISPATCH"

            # 6. Build the worker image only, do not run a container
            echo "--- Building worker image ---"
            cd "$REPO_DIR/worker-service"
            DOPPLER_TOKEN="$DOPPLER_TOKEN_WORKER" doppler secrets download --no-file --format env > .env
            docker build -t heimdall-worker:latest .

            # 7. scale-worker-service (uses the image built above)
            deploy_service "scale-worker-service" "scale-worker-service" "$DOPPLER_TOKEN_SCALE_WORKER"

            # Keep the 8GB root disk from filling up with old image layers
            docker image prune -f

            pm2 save
            pm2 list
        env:
          DOPPLER_TOKEN_ALERT: ${{ secrets.DOPPLER_TOKEN_ALERT }}
          DOPPLER_TOKEN_DISPATCH: ${{ secrets.DOPPLER_TOKEN_DISPATCH }}
          DOPPLER_TOKEN_WORKER: ${{ secrets.DOPPLER_TOKEN_WORKER }}
          DOPPLER_TOKEN_SCALE_WORKER: ${{ secrets.DOPPLER_TOKEN_SCALE_WORKER }}
